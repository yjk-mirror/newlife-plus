# Scene written by Secondarian
#
# Overview:
# PC is at the quiet but infamous street waiting for customers.
#
# Key Paths:
# - The PC rejects him.
# - The PC has sex with the guy for money.
# - The PC changes her mind.
# 
# Scene access:
# Via special weekday/weekend action.
#
# Preconditions:
# A male NPC ("m") for which the following is true:
# - No random encounters.
# - Not befriendable.
#
# The scene takes 1 male NPC and no female ones:
# "m" is the customer.
# Both should be wearing going out clothes. 
# The scene takes place on a dark abandoned street.

textFileName: spMain.vm

sceneDescriptionTextId: sceneDescriptionText

