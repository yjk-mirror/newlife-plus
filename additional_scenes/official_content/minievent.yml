# Scene written by Lost Trouting
# Preconditions for this scene:
#
# $bf is the PC's partner (can be null)
# $gf is the PC's partner (can be null). The PC can only have one partner, so $gf, $bf or both will always be null.
# $exlover is someone that the PC has slept with before (can be null)
# Specifically, they must have done oral, anal or PIV sex. He must not have the no-random-appearances, disabled or trounced traits. 
# He must not be the PC's partner and their relationship cannot be Strangers either (as he then wouldn't remember her well enough to recognise)
#
# $maleFriend is a random male friend of the PC (can be null)
# $femaleFriend is a random female friend of the PC (can be null)
#
# $randomMale is a random male character (should not be $bf or $maleFriend)
# $randomFemale is a random female character (should not be $gf or $femaleFriend)


# The two random characters cannot be the PC's partner, one of her friends or have the disabled or no-random-appearances traits. Otherwise they're chosen completely at random.
# In the unlikely situation that no such character exists then the event will not fire.
# -SO

textFileName: minievent.vm

sceneDescriptionTextId: sceneDescriptionText

testingInfo:
 playerOutfit: CASUAL
 maleNpcs:
  - id: bf
    outfit: CASUAL
  - id: exlover
    outfit: CASUAL
  - id: maleFriend
    outfit: CASUAL
  - id: randomMale
    outfit: CASUAL
 femaleNpcs:
  - id: gf
    outfit: CASUAL
  - id: femaleFriend
    outfit: CASUAL
  - id: randomFemale
    outfit: CASUAL


 location:
  usePlayerHome: true



intro:
 textId: introText
 effects:
  - effect: $scene.hideNpc($bf)
    condition: $bf
  - effect: $scene.hideNpc($gf)
    condition: $gf
  - effect: $scene.hideNpc($exlover)
    condition: $exlover
  - effect: $scene.hideNpc($maleFriend)
    condition: $maleFriend
  - effect: $scene.hideNpc($femaleFriend)
    condition: $femaleFriend
  - effect: $scene.hideNpc($randomMale)
    condition: $randomMale
  - effect: $scene.hideNpc($randomFemale)
    condition: $randomFemale
 followUpActions:
  sayYes: $eventType=="BF"
  sayNo: $eventType=="BF"
  sayYesGf: $eventType=="GF"
  sayNoGf: $eventType=="GF"
  sayYesFFriend: $eventType=="FFRIEND"
  sayNoFFriend: $eventType=="FFRIEND"
  sayYesMFriend: $eventType=="MFRIEND"
  sayNoMFriend: $eventType=="MFRIEND"
  soloEvent: $eventType=="SOLO"
  soloNap: $eventType=="SOLO"


actions:
 - id: sayYes
   shortDesc: Yes
   longDesc: Agree to meet
   textId: bfYesText
   allowNpcActions: true
   # Use the male NPC actions to choose a scene to transition to
   
 - id: sayNo
   shortDesc: No
   longDesc: You have other things that you need to do.
   textId: bfNoText
   finishScene: true

 - id: sayYesGf
   shortDesc: Yes
   longDesc: Agree to meet
   textId: gfYesText
   allowNpcActions: true
   # Use the male NPC actions to choose a scene to transition to
   
 - id: sayNoGf
   shortDesc: No
   longDesc: You have other things that you need to do.
   textId: gfNoText
   finishScene: true

 - id: sayYesFFriend
   shortDesc: Yes
   longDesc: Agree to meet
   textId: ffriendYesText
   allowNpcActions: true
   # Use the male NPC actions to choose a scene to transition to
   
 - id: sayNoFFriend
   shortDesc: No
   longDesc: You have other things that you need to do.
   textId: ffriendNoText
   finishScene: true

 - id: sayYesMFriend
   shortDesc: Yes
   longDesc: Agree to meet
   textId: mfriendYesText
   allowNpcActions: true
   # Use the male NPC actions to choose a scene to transition to
   
 - id: sayNoMFriend
   shortDesc: No
   longDesc: You have other things that you need to do.
   textId: mfriendNoText
   finishScene: true
      
 - id: soloEvent
   shortDesc: Find something to do
   longDesc: You should find something more interesting to do in your free time than just napping
   textId: soloEventText
   allowNpcActions: true
   # Use the male NPC actions to choose a scene to transition to
   
 - id: soloNap
   shortDesc: Take a nap
   longDesc: You should use your free time to relax and rest up
   textId: soloNapText
   finishScene: true





