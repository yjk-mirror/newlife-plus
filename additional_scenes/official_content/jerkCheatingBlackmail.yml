# - Unbeknownst by the jerk, the bf is cool with the pc sleeping around. The PC and BF join forces to punish the jerk for his attempted blackmail.
# - The jerk tells a doormat BF about cheating, and the PC mocks and humiliates him about it before sleeping with the jerk again.
# 
# Scene access:
# By random event, weekday evening timeslot.
#
# Preconditions:
# The PC has a partner.
# A male NPC exists for whom all the following are true:
#  - Is not the PC's partner.
#  - Is not a restricted special NPC (i.e. does not have the no_random-appearance trait).
#  - Has the Jerk personality.
#  - Finds the PC attractive (at least at 'ok' level, or "attracted" if the just_friends flag is set).
#  - Does not have max liking (close level) towards the PC
#  - Has not been TROUNCED by the PC, and has not had a negative outcome from previous blackmail attempts.
#  - The PC has cheated on her partner with this NPC, and that cheating has not been discovered or timed out.
#
# Any severity of cheating is valid (other than NONE, obviously), but the scene should perhaps be more common at higher severities.
# 
#
# The scene takes 2 male NPCs and no female ones:
# "bf" is the player's partner (who may be her boyfriend, fiance or husband - "bf" is just shorthand). 
# "jerk" is the NPC defined in the preconditions above.
# Both should be wearing casual clothes. 
# The scene takes place in the pc's home. 

