   # That should be rare but could happen if e.g. a traitChange was called for but there were no possible ones.
   followUpActions:
    finalCommands: '$leaveTrance && $m.personality == "JERK"'
    leaveTrance: '$leaveTrance && $m.personality != "JERK"'
    awaitHypnosis: '!$leaveTrance'

   
