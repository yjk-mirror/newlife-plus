# Scene written by splendidostrich
#
# Overview:
# Hypnosis scene: this is the actual trance.
# Has 2 main paths: the "evil" path requires a hypnotist with the jerk personality, such as the special EVIL_HYPNOTIST character. 
# The good path will fire for a hypnotist with any other personality, such as the GOOD_HYPNOTIST who is either average, romantic or caring.
# The good path requires a particular scene flag to be set in advance to decide what the hypnotist is trying to accomplish. 
# Evil hypnosis involves a variety of creepy acts, such as hypnotising the PC into gaining sexual traits or sleeping with the hypnotist.

# Scene access:
# This scene is intended to be accessed by other scenes which will set up the situation. 
# Typically this will take place at the PC's home in casual clothing, but these are not absolute restrictions.
# The scene assumes the PC is sitting on a sofa of some kind.
#
# Preconditions:
# m is the male npc doing the hypnotising. He should typically have the HYPNOTIST trait, though the scene will not error if he does not.
#

