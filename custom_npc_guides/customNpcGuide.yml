# LIKES_CASUAL : Opposed to LIKES_ELEGANT. More attracted to casual girls, less so to elegant ones.
# DULL : Opposed to INTERESTING. He's boring to spend time with and you won't enjoy talking to him. Unless he's rocking your socks in bed, your character 
#        will usually dislike a dull npc and this means it'll be especially hard to become non-sexual friends with one.
