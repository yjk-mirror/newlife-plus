# This is a heavily-commented example of a user created male npc for Newlife by Splendid Ostrich Games. Lines beginning with # are comments. 
# There is a separate file for female NPCs, as the valid entries and values are different for the two npc types.
#
# This is intended as a reference. If you plan to create files to share with other players, then 
# it'll probably be easier for them to read if you use the un-commented base file that's linked from http://splendidostrich.blogspot.co.uk/p/custom-npcs.html.
# This base file is also available in the Newlife zip under the custom_npc_guides folder.
#
# The custom npc feature was added in version 0.3.11. 
# If you're using an  earlier version than 0.3.11 then your game won't be able to understand these .yml files and load custom npcs. 
# All the text below assumes you're using an appropriate version.
#
# To get an npc loaded into the game, define it in a .yml file like this one and put it in newlife_gamedata/user_created_npcs. 
# The game will automatically create an empty folder of this name when it runs, if the folder doesn't already exist.
#
# Invalid npcs will not load into the game. 
# If you're using version 0.3.12 or higher then you can test whether your custom npcs are valid or not in Newlife by clicking the 'Test NPCs' button 
# on the main menu. 
#  
# How custom npcs are loaded:
# When a new game is created, a certain number of 'normal' npcs are created. For version 0.3.23 this is 12. The totals for male and female NPCs are 
# handled separately and custom npcs of one type won't count towards the limit for the other. 
# The number of normal NPCs can be modified in the game options before creating a game. The adjustment can be set to a negative number to reduce the NPC total.
#
# Newlife will look in the above folder for .yml files and parse them for valid, enabled npcs.  
# It will then sort these npcs by priority and start adding them to the game until all have been added or it reaches the npc limit.
# If npcs have the same priority, then it's random which will get added first. This means that if you have, say, 15 npcs at priority 0, then 
# each game will have 12 chosen randomly. However, if you also had an npc with priority 2, then that one would always appear alongside 11 of the others.
# If there are fewer than 12 custom npcs, then they'll all be added and the game will then add normal npcs to total 12.
#
# Some special npcs are created separately and cannot be replaced by user-generated ones. This will not change in future versions
# because the game makes a lot of assumptions about what these npcs are like and it's important that these aren't overridden with custom values.
# Other special NPCs can be replaced by custom ones. These NPCs are identified by a special trait: see below for the list. 
# Special NPCs do not count towards the main NPC count.
#
# Some general tips on writing npcs:
# Most values are optional unless their comment says otherwise. 
# If you leave an optional entry with a blank value then the normal character creation algorithm will populate it based on the npc's other values.
# The same will happen if an optional entry is completely missing.
# An npc with every optional entry blank will be identical to the usual algorithmically-generated npcs that appear in the game.
#
# The comments for individual entries will say if they're case-sensitive. Usually they aren't.
# Whitespace before or after a value will usually be removed. 
# However, you shouldn't put whitespace at the start of a line before the entry name as this will make the npc loading fail.
# The exception is list entries such as traits. These should be indented by exactly one space, as seen in this file. Do not use tabs for this, only spaces.
#
# If an unexpected or invalid value is found, then that npc will not be created at all. This is deliberate - it makes it easier to 
# identify mistakes in npc creation or with the loading process. 
# Issues that will make an npc invalid include entries that aren't recognised, values that aren't allowed, values that conflict with
# each other (see individual entry comments for details), values that are the wrong type such as text instead of numbers.
#
# I hope that the instructions in this file will be sufficient to let you make your perfect date. Good luck, and have fun :)


# The --- separates different entries. You can include more than one npc in the same .yml file by using this as a separator.
# However, it's usually preferable to give each npc their own file. This is because if an invalid npc causes the parser to error  
# then it'll stop any other npcs from the same file being loaded.
---

# Type is a REQUIRED field. It must always be present. There are two valid values: MALE and FEMALE. However, the entries that can appear in the file and 
# their valid values are different for the two NPC types, and so guides for the two are separated into different files.  
# This file explains how to create a MALE custom NPC. For female NPCs, see customFemaleNpcGuide.yml.
type: MALE

# Enabled: whether the npc should be enabled to appear in games. A disabled npc will never show up in new games.
# This is case insensitive. It defaults to false if not present and any value apart from TRUE will disable the npc. 
# The npc in this file is disabled as it's just intended as an example.
# To enable an npc, the value should read TRUE 
enabled: FALSE

# Priority determines which npcs get loaded first. It's optional - if missing it defaults to 0.
# If populated this must be a valid Java integer. Negative integers are ok.
# If you have fewer enabled npcs than the maximum for a game then priority is meaningless - all will be loaded.
# However, if you had twelve npcs at priority 0, one at priority 1 and one at priority -1 then the priority 1 npc would appear in 
# every game, 11 of the 12 priority 0 ones would appear, chosen at random, and the priority -1 one would never show up. 
priority: 0

# Name. This is case-sensitive, so if you want it to be consistent with other Newlife npcs it should be a capitalised first name.
# Newlife will try to have only one npc with a particular name and won't give other npcs of the same sex the same name as another in the game. 
# However, it is possible to have a male and a female NPC with the same name.
# Some names are reserved to certain npcs: currently these are Ivy and Horse. Npcs with these names are invalid. Additionally, an npc will not
# be added to the game if he has the same name as the player character.
# If you create two or more npcs with the same name, at most one of them will be loaded in any particular game. If they have different priorities, then 
# the lower priority one will never show up. 
# If given the same priority, the one that gets added will be random. You can use this to have different variants of an npc so you won't know 
# which one has loaded.
name: Bob

# Age: this is the npc's age in the game. It influences his body type, although that won't matter if you've set body type yourself.
# Age also has a small direct effect on attractiveness.
# This must be one of the following values, case insensitive: LATE_TEENS, EARLY_TWENTIES, TWENTIES, THIRTIES, FORTIES, FIFTIES,	OLD
age: THIRTIES

# Namelist ID. The ID for the list of names from which this NPC's name will be generated if they aren't given a name in this file.
# If both this and name are set then the name from this file will be used for the NPC themselves and the namelist will be used if you let the NPC name one of your children in-game.
#
# Namelists are defined in racedata.json. Default values are: general, scottish, irish, arabic, turkish, nigerian, swahili, indian, chinese and japanese. Others may be 
# added as development proceeds, and players can edit the file to add their own. 
# The value here is case-sensitive.
# 
# If left blank the value will be picked based off the race-id. For custom-race NPCs, the default namelist will be used.
nameListId: nigerian

# Race: the description of the npc's race. This can be any text string. It can appear in descriptive text but has no stat effects.
# Case insensitive - it'll automatically be converted to lower-case.
# This should fit into the sentence "he's a/an <race> man" e.g. "he's a black man" or "he's an elven man".
#
# Race definitions are set in the configuration file racedata.json and can be changed by players. 
# If blank, the game will pick a race definition based on weightings in that file.
# Assuming you're using the standard values, then they are black, white, east asian, south asian and middle-eastern. 
#
# If this is blank or one of the defined values then it's ok to leave the derived values (eye colour, hair colour, skin colour) blank 
# as they will be generated using the standard algorithm.
#
# However, if you enter any value that isn't in that file, it'll be treated as a custom race.
# In this case you MUST set all of the derived values in this file or the npc will be invalid and won't load into games.
race: black

# Eye colour: a text string. Case insensitive - it'll be converted to lower case when the npc is created.
# Like race, this can appear in descriptive text but has no stat effects.
# This can be blank or missing, but only if the race is not a custom value - see the race comment above.
eye colour: blue

# Hair colour: the same rules apply as for eye colour.
hair colour: black

# Skin colour: the same rules apply as for eye colour. I've entered "green" here just to highlight that the values you set here don't have to comply 
# with the normal ones for npcs.
skin colour: green

# The man's body type. If blank this will be automatically chosen with probabilities based on his age. 
# Setting this but not age will not have the opposite effect - in that case his age will be calculated without body type affecting it, and you could end 
# up with a combination that wouldn't naturally appear in the game under normal circumstances, such as a muscular elderly man.
# The following values are valid (case insensitive): AVERAGE, SKINNY, TONED, MUSCULAR, THICKSET, PAUNCHY, FAT 
# Figure affects attractiveness, quite a lot of descriptive text, and some actions. Only muscular, toned and thickset men will go to the gym.
figure: TONED

# Personality. Allowable values are: JERK, SELFISH, AVERAGE, ROMANTIC, CARING. Case insensitive.
# This has a significant effect on the npc's behaviour in game, and also on which traits are likely to be picked for him, although the latter only
# applies if you're allowing additional traits to be added during character creation.
personality: AVERAGE

# Traits: this is a list, which means that if present it should be described as below. 
# Specifically, the first line should read "traits:" with no whitespace at the start of the line.
# Subsequent lines should have a space, followed by "- " and then the name of the trait. It is essential to have the space at the start of the line and again
# after the "-".
# The trait names are case insensitive.
#
# You can include as many traits as you like. However, every trait must be one of the allowable values below.
# Additionally, you cannot include trait opposites together in the same npc. For example, an npc with both CONSCIENTIOUS and HATES_CONDOMS will be invalid.
# Traits need to be specifically set up to work in custom npcs, so if you find a trait that's added to the game in a future version doesn't work here then
# report it as a bug - assuming that it's a trait that makes sense for custom characters.
#
# Although an npc with trait opposites is invalid, it is ok to create one with traits that normally wouldn't appear because of their personality or other 
# attributes. For example, you can have a character who is both MISANTHROPE and COLD_HEARTED even though these are usually restricted to the JERK and SELFISH
# personalities respectively. This character would have hard caps on both liking and love.
# However, you might get odd results in game for very unsuited combinations. For example, the IMPREGNATOR trait is usually restricted to 
# jerks. If you add it to a CARING character, then you'll find that his callous and mocking impregnator-specific content won't match well with his normal 
# caring behaviour. 
# For the most part, unless they cause dramatic problems like crashes or scenes getting stuck in loops, I don't consider such issues to be bugs 
# if they can only arise for custom npcs.
#
# It is valid for an npc to have no traits at all - there are no required traits. 
#
# Here's the full list of allowable npc traits, with opposites and a short comment on what they do. 
