# LIKES_GOING_DOWN: Opposed to INEPT_LOVER. The NPC enjoys giving cunnilingus more and will sometimes initiate it without the PC asking.
# GOOD_DANCER : Opposed to BAD_DANCER. He is better at dancing and can appear at the dance competition. All dance class npcs have this trait but it's rare among
#               other ones.
