#                 any npc, but more common on jerk, selfish, impregnator and less likely for caring men and those who don't want kids.
# CONSCIENTIOUS : Opposed to HATES_CONDOMS and IMPREGNATOR. Prefers to use condoms and is much more likely to put one on without the pc asking. 
#                Will also respect her more for asking. More likely for men with nicer personalities or who don't want kids.
